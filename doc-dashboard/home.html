<!DOCTYPE html>
<html lang="en">

    <title>Doctor Dashboard</title>
    <link rel="stylesheet" href="homeStyle.css">

<body>
    <header>
        <img id="logo" src="../media/VedKriti-icon.png" alt="VedKriti">
        <nav class="tabs-container" aria-label="Doctor dashboard">
            <a id="tab-1" href="#find" class="active-tab" aria-selected="true">Search Consultations</a>
            <a id="tab-2" href="#consultations" aria-selected="false">Today's Consultations</a>
            <!-- <a id="tab-3" href="#update" aria-selected="false">Update Availability</a> -->
        </nav>
    </header>

    <main>
        <div class="tabs_panel">
            <section id="find" aria-labelledby="tab-1">
                <form id="searchForm" class="search-card">
                    <label for="date">
                        Date
                        <input type="date" id="date" name="date"
                            placeholder="Search by Date" autocomplete="off" required>
                    </label>
                    <button type="submit" id="search">Search</button>
                </form>
                <div id="searchMessage" class="message" aria-live="polite"></div>
                <div id="searchResults" class="results"></div>
            </section>

            <section id="consultations" aria-labelledby="tab-2" hidden>
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Doctor dashboard</p>
                        <h1>Today's Consultations</h1>
                    </div>
                    <div class="heading-actions">
                        <button type="button" id="emergencyCancel" class="emergency-cancel">
                            Emergency Cancel Today
                        </button>
                        <button type="button" id="refreshConsultations">Refresh</button>
                    </div>
                </div>
                <div id="consultationMessage" class="message" aria-live="polite"></div>
                <div id="todayResults" class="results"></div>
            </section>
