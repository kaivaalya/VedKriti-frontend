<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Video Consultation | DocSlot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="conference-header">
        <img
            src="../media/DocSlot-icon.png"
            alt="DocSlot"
        >

        <div class="conference-status">
            <span class="live-dot"></span>
            <span id="room-status">Ready to join</span>
        </div>
    </header>

    <main class="conference-main">

        <section
            class="conference-intro"
            id="join-panel"
        >
            <p class="eyebrow">
                Secure consultation
            </p>

            <h1>
                Your video appointment is ready
            </h1>

            <p>
                Allow camera and microphone access when prompted.
            </p>

            <button id="join-btn">
                Join consultation
            </button>
        </section>

        <section id="stream-wrapper" hidden>

            <div id="video-stream"></div>

            <div id="stream-controls">
                <button id="mic-btn">
                    Mute microphone
                </button>

                <button id="cam-btn">
                    Turn camera off
                </button>

                <button id="workflow-start-btn" style="background-color: #28a745; color: white;">
                    Start Consultation
                </button>
                
                <label id="workflow-upload-btn" class="button" style="display: none; cursor:pointer; background-color: #007bff; color: white; padding: 10px; border-radius: 4px; text-align: center;">
                    Send Report
                    <input type="file" id="workflow-upload-input" accept="image/*" capture="environment" hidden>
                </label>

                <button id="workflow-end-btn" style="display: none; background-color: #dc3545; color: white;">
                    End Consultation
                </button>

                <button
                    id="leave-btn"
                    class="danger"
                >
                    Leave consultation
                </button>
            </div>

        </section>

        <p
            id="conference-error"
            role="alert"
        ></p>

    </main>

    <script src="AgoraRTC_N-4.24.5.js"></script>
    <script type="module" src="app.js"></script>

</body>
</html>
