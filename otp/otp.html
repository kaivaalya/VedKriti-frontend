<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | DocSlot</title>
    <link rel="stylesheet" href="otpStyle.css">
</head>
<body>
    <main class="otp-page">
    <form class="otp-Form" id="otpForm">
        <div class="brand">
            <img src="../media/DocSlot-icon.png" alt="DocSlot">
            <span>Secure verification</span>
        </div>
        <span class="mainHeading" id="otpHeading">Enter OTP</span>
        <p class="otpSubheading" id="otpDescription">We have sent a verification code to your email.</p>
        <div class="inputContainer">
            <input required maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" aria-label="OTP digit 1">
            <input required maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" aria-label="OTP digit 2">
            <input required maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" aria-label="OTP digit 3">
            <input required maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" aria-label="OTP digit 4">
            <input required maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" aria-label="OTP digit 5">
            <input required maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-input" aria-label="OTP digit 6">
        </div>
        <button class="verifyButton" type="submit">Verify OTP</button>
        <p class="resendNote">Didn't receive the code? <button class="resendBtn" type="button">Resend code</button></p>
        <p id="err" role="alert" aria-live="polite"></p>
    </form>
    </main>
    <script type="module" src="otpAction.js"></script>
</body>
</html>
